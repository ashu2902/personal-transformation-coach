name: aura_transformation_engine
description: "AURA Body Transformation Engine - Flutter PWA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.2.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  image_picker: ^1.2.3
  mixpanel_flutter: ^2.4.0
  firebase_storage: ^13.5.0
  flutter_markdown: ^0.7.3
  url_launcher: ^6.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - web/icons/

dependency_overrides:
  firebase_core_web: <3.11.0
