version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
